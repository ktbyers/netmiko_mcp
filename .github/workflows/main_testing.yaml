---
name: Netmiko MCP Testing

on: [push, pull_request]

env:
  FORCE_COLOR: 1

jobs:
  checks:
    name: "Lint, Types & Security (Python 3.13)"
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.13.5"
          python-version: "3.13"
          enable-cache: true

      - name: Run shared lint, type, and security checks
        run: ./tests.sh checks

  audit:
    name: "Dependency Audit (Python ${{ matrix.python-version }}, ${{ matrix.platform }})"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        platform: ["linux", "macos", "windows", "wasm32-pyodide2025"]

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Install uv and host Python for lock-file validation
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.13.5"
          python-version: "3.13"
          enable-cache: true

      - name: Check lock-file freshness
        run: uv lock --check

      - name: Audit locked dependencies for target Python and platform
        run: >-
          uv audit --frozen
          --python-version '${{ matrix.python-version }}'
          --python-platform '${{ matrix.platform }}'

  unit-tests:
    name: "Unit Tests (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Run shared non-live tests
        run: ./tests.sh test '${{ matrix.python-version }}'
