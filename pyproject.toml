[project]
name = "netmiko-mcp"
version = "0.3.0"
description = "MCP Server for Netmiko Network Automation Library."
authors = [{ name = "Kirk Byers", email = "ktbyers@twb-tech.com" }]
license = { text = "Apache-2.0" }
readme = "README.md"
keywords = ["netmiko", "mcp", "network-automation", "ssh"]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: System :: Networking",
]
dependencies = [
    "mcp>=2.0.0",
    "netmiko>=4.7.0",
    "ntc-templates>=4.1.0",
    "pydantic-settings>=2.14.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.49.0",
]

[project.urls]
Homepage = "https://github.com/ktbyers/netmiko_mcp"
Repository = "https://github.com/ktbyers/netmiko_mcp"

[project.scripts]
netmiko-mcp = "netmiko_mcp.server:main"

[dependency-groups]
# Dev tooling is pinned to EXACT versions on purpose. These packages gate CI
# (linting, type-checking, tests, audits); a floating `>=` lets a full `uv lock`
# regeneration silently bump them and change lint/type rules, breaking CI without a
# code change. Bump these deliberately (edit the pin, then `uv lock`), never by accident.
dev = [
    "bandit==1.9.4",
    "httpx==0.28.1",
    "mypy==2.3.0",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-mypy==1.0.1",
    "ruff==0.16.2",
    "types-paramiko==5.0.0.20260724",
    "types-pyyaml==6.0.12.20260724",
]

[tool.uv]
managed = true
package = true

[tool.ruff]
line-length = 100

# Specify your floor Python version (i.e. minimum version Netmiko supports) 
target-version = "py310"

# Files or directories to exclude from linting and formatting
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
# Enable these rule sets for a modern, clean codebase
# E/W = pycodestyle, F = Pyflakes, I = isort, UP = pyupgrade, B = bugbear
# select = ["E", "F", "W", "I", "UP", "B"]

# If you want to be extra strict about line length in the linter:
# extend-select = ["E501"]

# Rules intentionally disabled (deliberate design decisions, not defects):
#   BLE001: connection.py catches broad `Exception` on purpose so a device or command
#           failure returns a structured error to the client and is recorded in the audit
#           trail rather than crashing the server.
#   TRY004: inventory.py raises `ValueError` (not `TypeError`) when Netmiko returns its
#           string "not found" sentinel; callers in server.py catch that ValueError.
#   RUF010: `{str(e)}` in f-strings is kept over the `{e!s}` conversion flag for
#           readability; the two are behaviorally identical.
#   SIM102: collapsing nested `if`s into a single `and` condition can hurt readability
#           when the conditions are non-trivial; keep nesting where it reads better.
ignore = ["BLE001", "TRY004", "RUF010", "SIM102"]

[tool.ruff.lint.isort]
# Keep `import x as y` aliases in the same parenthesized block as their module's
# other imports instead of isort's default of splitting each alias into its own
# `from module import (...)` statement (more readable, fewer stray import blocks).
combine-as-imports = true

[tool.coverage.run]
source = ["netmiko_mcp"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 98
exclude_lines = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
]

[tool.ruff.format]
# Matches Black's style but honors the 100 char limit
quote-style = "double"
indent-style = "space"

# Optional: Formats code snippets inside docstrings!
docstring-code-format = true
docstring-code-line-length = 80

